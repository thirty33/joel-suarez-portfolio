AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infraestructura para joel-suarez-portfolio: bucket S3 privado con el sitio
  estático, distribución CloudFront (OAC) con dominio propio, certificado ACM,
  registros Route 53, WAF con límite por IP y plan Free de tarifa plana.

# ==============================================================================
# CONTRATO DE ACTUALIZACIÓN (leer antes de editar)
#
# 1. Desplegar SIEMPRE en us-east-1 (CloudFront solo acepta certificados ACM de
#    esa región y el WAF de alcance CLOUDFRONT solo existe ahí) con:
#      aws cloudformation deploy --stack-name joel-portfolio-prod \
#        --template-file infrastructure/cloudformation.yml \
#        --no-fail-on-empty-changeset --parameter-overrides ...
#    Antes de un cambio grande, previsualizar con --no-execute-changeset.
# 2. No renombrar los logical IDs (SiteBucket, CloudFrontDistribution...):
#    CloudFormation lo toma como borrar el recurso viejo y crear uno nuevo.
# 3. Cambiar un nombre explícito (bucket, OAC, función, WAF) o el dominio del
#    certificado fuerza un REEMPLAZO del recurso.
# 4. La zona hospedada NO es parte del stack: la crea el registro del dominio
#    en Route 53 y entra como parámetro. Borrar el stack no toca el dominio.
# 5. El plan de tarifa plana no se puede cambiar de tier con un update: se
#    cambia desde la consola de CloudFront o con la API de PricingPlanManager.
# ==============================================================================

# ==============================================================================
# PARAMETERS
# ==============================================================================
Parameters:
  SiteBucketName:
    Type: String
    Description: Nombre del bucket S3 para el sitio (debe ser único globalmente)

  DomainName:
    Type: String
    Description: Dominio principal, sin www (www redirige a este con 301)

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: ID de la zona hospedada del dominio (la creó el registro en Route 53)

  RateLimitPerIp:
    Type: Number
    Default: 1000
    MinValue: 100
    Description: Peticiones máximas por IP cada 5 minutos antes de bloquearla (una visita hace ~50)

  Environment:
    Type: String
    Description: Ambiente de despliegue
    AllowedValues:
      - dev
      - staging
      - prod

# ==============================================================================
# RESOURCES
# ==============================================================================
Resources:

  # ----------------------------------------------------------------------------
  # ACM CERTIFICATE - dominio + www, validado por DNS en la zona del dominio
  # ----------------------------------------------------------------------------
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: joel-suarez-portfolio

  # ----------------------------------------------------------------------------
  # S3 BUCKET - Sitio estático (dist/: HTML, CSS, JS, imágenes, íconos, fuentes)
  # ----------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: joel-suarez-portfolio

  # ----------------------------------------------------------------------------
  # S3 BUCKET POLICY - Sitio: solo lo lee la distribución CloudFront (OAC)
  # ----------------------------------------------------------------------------
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ----------------------------------------------------------------------------
  # CLOUDFRONT ORIGIN ACCESS CONTROL (OAC)
  # ----------------------------------------------------------------------------
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${SiteBucketName}-oac'
        Description: !Sub 'OAC for ${SiteBucketName}'
        SigningProtocol: sigv4
        SigningBehavior: always
        OriginAccessControlOriginType: s3

  # ----------------------------------------------------------------------------
  # CLOUDFRONT FUNCTION - Host canónico (301) + rewrite a index.html
  # Cualquier host que no sea el dominio principal (www o el *.cloudfront.net)
  # redirige con 301 al dominio principal, conservando la query string (UTM).
  # ----------------------------------------------------------------------------
  URLRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${SiteBucketName}-url-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: 'Redirect to the canonical host + rewrite directory URLs to index.html'
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var host = request.headers.host && request.headers.host.value;

          if (host !== '${DomainName}') {
            var qs = request.querystring;
            var pairs = Object.keys(qs).map(function (k) {
              return qs[k].value ? k + '=' + qs[k].value : k;
            });
            var query = pairs.length ? '?' + pairs.join('&') : '';
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + uri + query } }
            };
          }

          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.includes('.')) {
            request.uri += '/index.html';
          }
          return request;
        }

  # ----------------------------------------------------------------------------
  # WAF - Bloquea por un rato a la IP que supere RateLimitPerIp peticiones en
  # 5 minutos. Incluido en el plan Free (hasta 5 reglas, sin rule groups).
  # Sin desafíos ni CAPTCHA: Googlebot y AdsBot tienen que ver la web limpia.
  # ----------------------------------------------------------------------------
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${SiteBucketName}-waf'
      Description: 'Rate limit per IP for joel-suarez-portfolio'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${SiteBucketName}-waf'
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerIp
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-ip
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: joel-suarez-portfolio

  # ----------------------------------------------------------------------------
  # CLOUDFRONT DISTRIBUTION
  # ----------------------------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'joel-suarez-portfolio (${Environment})'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        WebACLId: !GetAtt WebACL.Arn

        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'

        ViewerCertificate:
          AcmCertificateArn: !Ref SSLCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontOAC

        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt URLRewriteFunction.FunctionARN

        # Una dirección que el sitio no tiene responde src/pages/404.astro con un
        # 404 real (no la portada con 200). El bucket es privado (OAC), así que un
        # archivo que no existe llega como 403.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0

        Restrictions:
          GeoRestriction:
            RestrictionType: none

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: joel-suarez-portfolio

  # ----------------------------------------------------------------------------
  # ROUTE 53 - Alias A/AAAA del dominio y de www hacia CloudFront
  # Z2FDTNDATAQYW2 es el ID de zona fijo de CloudFront para registros alias.
  # ----------------------------------------------------------------------------
  Route53RecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  Route53RecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  Route53RecordWwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  Route53RecordWwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ----------------------------------------------------------------------------
  # PLAN FREE DE TARIFA PLANA - 0 USD/mes, sin cobros por excedente.
  # Cubre la distribución, el WAF y la zona hospedada. Al referenciarlos,
  # CloudFormation lo crea al final y lo borra primero (un Free se cancela al
  # instante).
  # ----------------------------------------------------------------------------
  PricingPlan:
    Type: AWS::PricingPlanManager::Subscription
    Properties:
      PlanFamily: CloudFront
      PlanTier: FREE
      UsageLevel: DEFAULT
      ResourceArns:
        - !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'
        - !GetAtt WebACL.Arn
        - !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}'

# ==============================================================================
# OUTPUTS
# ==============================================================================
Outputs:
  SiteBucketName:
    Description: Nombre del bucket del sitio
    Value: !Ref SiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-SiteBucketName'

  DistributionId:
    Description: ID de la distribución CloudFront
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  DistributionURL:
    Description: URL de CloudFront (redirige al dominio principal)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  WebsiteURL:
    Description: URL del sitio (dominio principal)
    Value: !Sub 'https://${DomainName}'

  CertificateArn:
    Description: ARN del certificado ACM
    Value: !Ref SSLCertificate

  WebACLArn:
    Description: ARN del WAF
    Value: !GetAtt WebACL.Arn

  PricingPlanArn:
    Description: ARN de la suscripción al plan Free
    Value: !Ref PricingPlan
